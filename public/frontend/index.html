<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touralie Media Library Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --radius: 0.25rem;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--primary);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .form-group { margin-bottom: 1rem; }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        input[type="text"], input[type="file"], input[type="number"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.9rem;
        }

        input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .progress-wrapper {
            margin-top: 1rem;
            background: #e2e8f0;
            height: 10px;
            border-radius: var(--radius);
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        pre {
            background: #1e293b;
            color: #38bdf8;
            padding: 1rem;
            border-radius: var(--radius);
            font-size: 0.85rem;
            overflow-x: auto;
            max-height: 250px;
            margin-top: 1rem;
        }

        .preview-box {
            margin-top: 1rem;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            display: none;
            text-align: center;
        }

        video, img, iframe { width: 100%; max-height: 400px; object-fit: contain; }

        .flex { display: flex; gap: 0.5rem; align-items: flex-end; }
        .flex > div { flex: 1; }
        .flex button { width: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Media Upload & Playback Tester</h1>

        <!-- PHASE 2: UPLOAD TO STORAGE -->
        <div class="card">
            <div class="card-title">1. Direct Upload to Storage (PUT)</div>
            <div class="form-group">
                <label>Pre-signed Upload URL (from Swagger init-upload)</label>
                <input type="text" id="uploadUrl" placeholder="Paste the upload_url from Swagger here...">
            </div>
            <div class="form-group">
                <label>Select Media File (Video, Image, or PDF)</label>
                <input type="file" id="mediaFile" accept="video/*,image/*,.pdf">
            </div>
            <button id="uploadBtn" onclick="performUpload()">Upload to Storage</button>

            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="uploadResponse" style="display: none;">
                <pre><code id="uploadCode"></code></pre>
            </div>
        </div>

        <!-- PHASE 3: COMPLETE UPLOAD -->
        <div class="card">
            <div class="card-title">2. Complete Upload</div>
            <div class="form-group">
                <label>Admin / Practitioner Token (Bearer)</label>
                <input type="text" id="adminToken" placeholder="Paste your JWT token here...">
            </div>
            <div class="form-group">
                <label>Video / Media ID</label>
                <input type="text" id="videoId" placeholder="Paste the video_id from Swagger response here...">
            </div>
            <button onclick="completeUpload()">Complete Upload (PATCH)</button>
            <div id="completeResponse" style="display: none;">
                <pre><code id="completeCode"></code></pre>
            </div>
        </div>

        <!-- MEDIA PREVIEW -->
        <div class="card">
            <div class="card-title">Media Preview</div>
            <div class="form-group">
                <label>Media URL (from complete-upload or get-one)</label>
                <div class="flex">
                    <div><input type="text" id="playUrl" placeholder="Enter media URL to preview..."></div>
                    <button onclick="loadMedia()" style="background: #10b981;">Preview</button>
                </div>
            </div>

            <div class="preview-box" id="previewContainer">
                <video id="videoPlayer" controls style="display: none;"></video>
                <img id="imagePreview" style="display: none;" alt="Preview">
                <iframe id="pdfPreview" style="display: none; height: 450px;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');

        async function performUpload() {
            const url = document.getElementById('uploadUrl').value.trim();
            const file = document.getElementById('mediaFile').files[0];

            if (!url) return alert('Please enter the Pre-signed Upload URL.');
            if (!file) return alert('Please select a file to upload.');

            uploadBtn.disabled = true;
            progressWrapper.style.display = 'block';
            progressBar.style.width = '30%';
            document.getElementById('uploadResponse').style.display = 'none';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const contentType = getContentType(file.name);

                const response = await fetch(url, {
                    method: 'PUT',
                    body: arrayBuffer,
                    headers: { 'Content-Type': contentType }
                });

                progressBar.style.width = '100%';
                uploadBtn.disabled = false;
                document.getElementById('uploadResponse').style.display = 'block';

                const responseData = {
                    status: response.status,
                    statusText: response.statusText,
                    ok: response.ok
                };

                let extraInfo = '';
                if (response.status === 405) {
                    extraInfo = '\nNOTE: 405 Method Not Allowed usually happens if the pre-signed URL was generated for a different HTTP method, or if targeted at MinIO Web Console (port 9001) instead of MinIO S3 API (port 9000).';
                }

                document.getElementById('uploadCode').textContent = JSON.stringify(responseData, null, 2) + extraInfo;

                if (response.ok) {
                    alert('Success: File uploaded to storage!');
                } else {
                    const errorText = await response.text();
                    console.error('Upload error:', errorText);
                    alert(`Upload failed: ${response.status} ${response.statusText}`);
                }
            } catch (err) {
                uploadBtn.disabled = false;
                console.error('Fetch error:', err);
                alert('Network error or CORS issue when uploading to storage. Check browser console.');
            }
        }

        function getApiBase() {
            const backendInput = document.getElementById('backendUrl')?.value.trim();
            if (backendInput) return backendInput.replace(/\/+$/, '');
            
            // If opened via Live Server (e.g. port 5500), target NestJS backend on port 4001
            if (window.location.port && window.location.port !== '4001') {
                return `${window.location.protocol}//${window.location.hostname}:4001`;
            }
            return '';
        }

        async function completeUpload() {
            const token = document.getElementById('adminToken').value.trim();
            const videoId = document.getElementById('videoId').value.trim();
            if (!videoId) return alert('Video/Media ID is required.');

            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
                }

                const baseUrl = getApiBase();
                const response = await fetch(`${baseUrl}/api/admin/library/${videoId}/complete-upload`, {
                    method: 'PATCH',
                    headers: headers
                });

                const res = await response.json();
                document.getElementById('completeResponse').style.display = 'block';
                document.getElementById('completeCode').textContent = JSON.stringify(res, null, 2);

                if (res.success) {
                    alert('Success: Upload completed & media status updated!');
                } else {
                    alert('Error: ' + res.message);
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
            }
        }

        function loadMedia() {
            const url = document.getElementById('playUrl').value.trim();
            if (!url) return alert('Enter a media URL.');

            const previewContainer = document.getElementById('previewContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const imagePreview = document.getElementById('imagePreview');
            const pdfPreview = document.getElementById('pdfPreview');

            videoPlayer.style.display = 'none';
            imagePreview.style.display = 'none';
            pdfPreview.style.display = 'none';

            previewContainer.style.display = 'block';

            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.match(/\.(mp4|mkv|mov|avi|webm)$/)) {
                videoPlayer.style.display = 'block';
                videoPlayer.src = url;
                videoPlayer.load();
                videoPlayer.play();
            } else if (cleanUrl.match(/\.(jpg|jpeg|png|webp|gif|svg)$/)) {
                imagePreview.style.display = 'block';
                imagePreview.src = url;
            } else if (cleanUrl.endsWith('.pdf')) {
                pdfPreview.style.display = 'block';
                pdfPreview.src = url;
            } else {
                imagePreview.style.display = 'block';
                imagePreview.src = url;
            }
        }

        function getContentType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            const mimeTypes = {
                'mp4': 'video/mp4',
                'mkv': 'video/x-matroska',
                'mov': 'video/quicktime',
                'avi': 'video/x-msvideo',
                'webm': 'video/webm',
                'jpg': 'image/jpeg',
                'jpeg': 'image/jpeg',
                'png': 'image/png',
                'webp': 'image/webp',
                'pdf': 'application/pdf'
            };
            return mimeTypes[extension] || 'application/octet-stream';
        }
    </script>
</body>
</html>
